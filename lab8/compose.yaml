name: university-lab8
services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: event_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Local .env is required}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - event-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_app -d event_db"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  event-data:
